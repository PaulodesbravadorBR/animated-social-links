<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Biblioteca de ícones (Bootstrap Icons) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <title>Follow me on social media</title>
  </head>
  <body>
    <!-- REDE SOCIAL -->
    <ul>
      <!-- INSTAGRAM: degradê laranja -> rosa/magenta -->
      <li style="--cor1: #f09433; --cor2: #bc1888">
        <a href="#" aria-label="Instagram"></a>
        <span class="icon"><i class="bi bi-instagram"></i></span>
        <span class="text">Instagram</span>
      </li>

      <!-- YOUTUBE: degradê vermelho claro -> vermelho escuro -->
      <li style="--cor1: #ff3b3b; --cor2: #b00000">
        <a href="#" aria-label="Youtube"></a>
        <span class="icon"><i class="bi bi-youtube"></i></span>
        <span class="text">Youtube</span>
      </li>

      <!-- LINKEDIN: degradê azul escuro -> azul claro -->
      <li style="--cor1: #0a66c2; --cor2: #00a0dc">
        <a href="https://www.linkedin.com/in/paulotraveler/" target="_blank" aria-label="LinkedIn"></a>
        <span class="icon"><i class="bi bi-linkedin"></i></span>
        <span class="text">LinkedIn</span>
      </li>

      <!-- GITHUB: degradê cinza escuro -> roxo -->
      <li style="--cor1: #2b3137; --cor2: #6e5494">
        <a href="https://github.com/PaulodesbravadorBR" target="_blank" aria-label="Github"></a>
        <span class="icon"><i class="bi bi-github"></i></span>
        <span class="text">Github</span>
      </li>
    </ul>
  </body>
</html>
